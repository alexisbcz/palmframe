name: Post to Bluesky

# Pushes to main no longer post; run it by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node .github/scripts/bluesky.mjs
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          BLUESKY_HANDLE: palmframe.com
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          PRUNA_API_KEY: ${{ secrets.PRUNA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
