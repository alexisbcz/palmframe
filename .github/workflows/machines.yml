name: Run content machines

# Runs one tick by hand. The schedule lives in Supabase (the machines-tick job).
# Each tick listens for a short window, catches up on what it missed, runs the
# agents that are due and publishes what's approved.
# Does nothing until both secrets are set.
on:
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Tick
        env:
          TICK_URL: ${{ secrets.MACHINES_TICK_URL }}
          CRON_SECRET: ${{ secrets.MACHINES_CRON_SECRET }}
        run: |
          if [ -z "$TICK_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Machines are not set up; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 150 \
            --request POST --header "Authorization: Bearer $CRON_SECRET" "$TICK_URL"
